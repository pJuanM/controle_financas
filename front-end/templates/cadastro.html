{% extends "base_publica.html" %}

{% block titulo %}
Cadastro
{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', path='/css/cadastro.css') }}">
{% endblock %}

{% block conteudo %}
<h1 class="titulo-pagina">CADASTRO</h1>
<section class="formulario">
    <form onsubmit="envioFormularioCadastro(event)" action="/usuario/cadastro/criar" method="POST" id="formulario" data-tipo="usuario" data-url="/usuario/cadastro/criar">
        <div class="grupo_campo">
            <input required type="text" id="usuario" name="usuario" placeholder="Usuário" autocomplete="off">
        </div>
        <div class="grupo_campo">
            <input required type="text" id="nome" name="nome" placeholder="Nome completo" autocomplete="off">
        </div>
        <div class="grupo_campo">
            <input required type="email" id="email" name="email" placeholder="E-mail" autocomplete="off">
        </div>
        <div class="grupo_campo">
            <input required type="password" id="senha" name="senha" placeholder="Senha" data-senha autocomplete="new-password">
        </div>
        <div class="grupo_campo">
            <input required type="password" id="confirme_senha" name="confirme_senha" placeholder="Confirme sua senha" data-confirme-senha autocomplete="new-password">
        </div>
        <p id="erroSenha"></p>
        <button onclick="cadastrarUsuario(event)" type="submit" id="enviar_formulario">Enviar Cadastro</button>
    </form>
    <p id="mensagemCadastro"></p>
</section>
<div class="mensagem">
    <p id="status_mensagem"></p>
</div>
{% endblock %}

{% block script %}
<script src="{{ url_for('static', path='/js/autenticar.js') }}"></script>
{% endblock %}
