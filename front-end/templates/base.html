<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"   content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Controle Financeiro{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', path='assets/icons/controleFinanceiro.png')}}">
    <link rel="manifest" href="{{ url_for('static', path='manifest.json') }}">
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    {% block css %}
    {% endblock %}
</head>
<body>
    {% include 'menu_lateral.html' %}
    <header class="container menu_navegacao">
        {% block header %}
        {% endblock %}
        <div class="menu_hamburguer">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div></div>
        <nav>
            <a href="/home">Home</a>
            <span>|</span>
            <a href="/usuario/logout">Sair</a>
        </nav>
    </header>
    <main class="container">
        {% block conteudo %}
        {% endblock %}
    </main>

    <script src="{{ url_for('static', path='/js/script.js') }}"></script>
    <script src="{{ url_for('static', path='/js/formulario.js') }}"></script>
    <script src="{{ url_for('static', path='/js/tabela.js') }}"></script>
    <script src="{{ url_for('static', path='/js/navegacao.js') }}"></script>

    
    {% block script %}
    {% endblock %}
    
</body>
</html>
